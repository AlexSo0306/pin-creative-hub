<style>
  :root {

    --bg: #000000;
    --surface: #090909;

    --fg: #ffffff;

    padding: 32px 28px 64px;

    color: var(--fg);

  .stage {

    background: var(--surface);

    display: flex;
    flex-wrap: wrap;
    gap: 26px 30px;
    align-items: flex-end;
  }
  .cell { text-align: center; }

    margin-top: 6px;

    font-size: 11px;

    letter-spacing: 0.04em;
  }

    display: flex;
    gap: 34px;
    align-items: center;

  }
  .hero-stage {
    border: 1px solid var(--border-soft);

  .controls { display: flex; flex-direction: column; gap: 14px; min-width: 260px; }

<h2 data-page-node-id="UeaucW4s4Uck2hFRHkYzYc">七态对照（每态一个独立实例）</h2>
<div class="stage" id="grid" data-page-node-id="zmr2CaYXJMrsLgZDGQ5XqX"></div>

<script type="module">
import { createMascot, MASCOT_STATES } from './mascot.js';

/* 主实例 */
let hero = createMascot(document.getElementById('hero'), {
  state: 'idle',
  energy: 0.7,
  followPointer: true,
  scale: 1.35,
});

const buttons = document.getElementById('state-buttons');
const stateNames = Object.keys(MASCOT_STATES);
stateNames.forEach((name) => {
  const b = document.createElement('button');
  b.textContent = MASCOT_STATES[name].label;
  b.dataset.state = name;
  b.addEventListener('click', () => {
    hero.setState(name);
    [...buttons.children].forEach((x) => x.classList.toggle('is-on', x === b));
  });
  buttons.appendChild(b);
});
buttons.firstChild.classList.add('is-on');

document.getElementById('energy').addEventListener('input', (ev) => {
  const v = Number(ev.target.value) / 100;
  hero.setEnergy(v);
  document.getElementById('energy-val').textContent = v.toFixed(2);
});

document.getElementById('toggle-follow').addEventListener('click', (ev) => {
  const on = !ev.target.classList.contains('is-on');
  ev.target.classList.toggle('is-on', on);
  hero.setPointerFollow(on);
});

document.getElementById('toggle-theme').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'fluent' ? '' : 'fluent';
  if (next) root.setAttribute('data-theme', next);
  else root.removeAttribute('data-theme');
});

document.getElementById('btn-destroy').addEventListener('click', (ev) => {
  if (hero) {
    hero.destroy();
    hero = null;
    ev.target.textContent = '已销毁';
    ev.target.disabled = true;
  }
});

/* 七态网格：静态对照，各自独立实例 */
const grid = document.getElementById('grid');
stateNames.forEach((name) => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const holder = document.createElement('div');
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = name;
  cell.append(holder, cap);
  grid.appendChild(cell);
  createMascot(holder, { state: name, energy: 0.7, followPointer: false, scale: 0.78 });
});
</script>
