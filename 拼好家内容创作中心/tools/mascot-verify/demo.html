<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-page-node-id="3jwEXnpf25stoCeflw3bon">
<head data-page-node-id="tvOGB4NiNVS5IJSCDfYOHG">
<meta charset="utf-8" data-page-node-id="jYp1O8KTgrZKnIZyUe5QeR">

<title>锅宝 v2 · 引擎演示台</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #e4e6eb;
    --fg: #1b1d21;
    --fg-dim: #6b7280;
    --accent: #2f8bff;
    --gb-badge: #2f8bff;
    --radius: 12px;
    /* 主题探针：角色 JS 读它决定用墨色的哪一组端点 */
    --gb-scheme: light;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16181d;
    --panel: #1e2126;
    --line: #2c3037;
    --fg: #ecedf0;
    --fg-dim: #9aa1ab;
    --gb-scheme: dark;
  }
  /* 角色：眼睛是挖空，填充宿主背景色；覆盖动效跟随墨色 */
  .gb-mascot { display: block; width: 100%; height: 100%; overflow: visible; }
  .gb-fx-back, .gb-fx-front { pointer-events: none; }
  .stage-inner { --gb-bg: var(--panel); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    padding: 22px 22px 60px;
  }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { color: var(--fg-dim); font-size: 12.5px; margin-bottom: 20px; }
  .layout { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .stage {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex; flex-direction: column; align-items: center;
    padding: 26px 18px 20px;
    position: sticky; top: 22px;
  }
  .stage-inner { width: 260px; height: 260px; display: grid; place-items: center; color: var(--fg); }
  .stage-inner svg { width: 100%; height: 100%; display: block; }
  .stage-label { margin-top: 12px; font-size: 15px; font-weight: 600; letter-spacing: .4px; }
  .stage-meta { color: var(--fg-dim); font-size: 12px; margin-top: 2px; }
  .stage-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--fg-dim); margin: 0 0 12px; font-weight: 600; }
  .group-label { font-size: 12px; color: var(--fg-dim); margin: 12px 0 6px; }
  .group-label:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: all .14s ease; line-height: 1.5;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; }
  .chip.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }

  button.act {
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  .readout { display: flex; gap: 18px; font-size: 12px; color: var(--fg-dim); margin-top: 14px; flex-wrap: wrap; }
  .readout b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-page-node-id="3rbbqRBnWMYlFu6WwUxavB">
  <h1 data-page-node-id="Afn0WxHLo1OaudynETfKKB">锅宝 v2 · 引擎演示台</h1>
  <div class="sub" data-page-node-id="nLvMvfQThvf6fzyqSXAa7Y">架构对标 grok-icon-study（clean-room 重写）· 资产全部原创 · 39 状态 / 8 形状 / 25 眼型 / 11 墨色</div>

  <div class="layout" data-page-node-id="MTRuOF9J2udMlTxig6tuVV">
    <div class="stage" data-page-node-id="m7wCLBNABcuGTmRe8NYs9C">
      <div class="stage-inner" id="stage" data-page-node-id="0Bqdo6BJmSmEMCEEK3NYgD"></div>
      <div class="stage-label" id="label" data-page-node-id="Z2nrGLLp87Sy4nKurqpJmb">待机 idle</div>
      <div class="stage-meta" id="meta" data-page-node-id="k0wg2PWwGAIUscVjHpF2Cw">团子 · 墨</div>
      <div class="stage-row" data-page-node-id="bnTobCg3j27KRsNvAOFyc2">
        <button class="act" id="btnTheme" data-page-node-id="WZcqNHigUwoLmX15oS47wC">切换主题</button>
        <button class="act" id="btnPause" data-page-node-id="vJ75uPqDQUIHQBKQMWFsz0">暂停</button>
        <button class="act" id="btnShot" data-page-node-id="Oo9KikhMy58qFNUveYdDoz">截图 PNG</button>
      </div>
      <div class="readout" data-page-node-id="fXCq4Lek0LOlljEmFWiehH">
        <span data-page-node-id="qUVx4OmYCfx95aKEvvknbw">帧率 <b id="fps" data-page-node-id="FKcGxF2nlpBW3UtyGszr3k">–</b></span>
        <span data-page-node-id="6XHBpIWe8yxAZMPJ6003WI">每帧同步耗时 <b id="cost" data-page-node-id="2Gtz8Jyewfu3TUEcXG1dVE">–</b></span>
        <span data-page-node-id="qiGEwXI6ugVUCwud11C6DI">环点数 <b id="ringN" data-page-node-id="QeehlaAthSc3zljMPv8xi8">–</b></span>
      </div>
    </div>

    <div data-page-node-id="DqG8Q4UzzdF4EveVvnfnjh">
      <div class="panel" id="statesPanel" data-page-node-id="gRdyKMB7l5Xy0tSNnUKk94">
        <h2 data-page-node-id="pd6UCo5kAgIHjvmToNbVxM">状态</h2>
        <div id="stateGroups" data-page-node-id="nVpjlRcezNDZH9EpoBu2E8"></div>
      </div>

      <div class="panel" data-page-node-id="aZzH2Wo1trJYLtEtBvAHzd">
        <h2 data-page-node-id="NnEjZ9NLw5RjKvYrk0Bxbb">形状</h2>
        <div class="chips" id="shapes" data-page-node-id="BovCYoQjoeT3Oi6zkrBBFT"></div>
      </div>

      <div class="panel" data-page-node-id="7gnHDCSH6Fiy3c6Ml47ygz">
        <h2 data-page-node-id="Nm6m97bsNAep8MLWuQxzWz">眼型（点击后固定，再点一次恢复轮播）</h2>
        <div class="chips" id="eyes" data-page-node-id="oLPQUQEPDztVfxBbIFEBF7"></div>
      </div>

      <div class="panel" data-page-node-id="kkIpdateZVWj1i6DrUZgYD">
        <h2 data-page-node-id="jM5jGjAwp8yGiOw6npX4b7">墨色</h2>
        <div class="chips" id="inks" data-page-node-id="6S85Tsgx4h6Zx4T1w2HQIH"></div>
      </div>
    </div>
  </div>

<script type="module">
/* 直接引用 public/ 下已提交的引擎 —— 不在这里放第二份副本，
   否则引擎一改、演示台还跑旧代码，两边就漂移了。 */
import { createMascot, GROUPS, SHAPE_NAMES, EYE_NAMES, INK_NAMES, INK } from "../../public/js/components/mascot/index.js";

const stage = document.getElementById("stage");
const mascot = createMascot(stage, { state: "idle", shape: "dango", ink: "ink" });

/* ── 状态按钮 ── */
const sg = document.getElementById("stateGroups");
for (const g of GROUPS) {
  const lab = document.createElement("div");
  lab.className = "group-label";
  lab.textContent = g.label;
  sg.appendChild(lab);
  const box = document.createElement("div");
  box.className = "chips";
  for (const s of g.states) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = s;
    b.setAttribute("aria-pressed", String(s === "idle"));
    b.onclick = () => {
      mascot.setState(s);
      for (const o of sg.querySelectorAll(".chip")) o.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-pressed", "true");
      document.getElementById("label").textContent = s;
    };
    box.appendChild(b);
  }
  sg.appendChild(box);
}

/* ── 形状 ── */
const sh = document.getElementById("shapes");
for (const n of SHAPE_NAMES) {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = n;
  b.setAttribute("aria-pressed", String(n === "dango"));
  b.onclick = () => {
    mascot.setShape(n);
    for (const o of sh.querySelectorAll(".chip")) o.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-pressed", "true");
    updateMeta();
  };
  sh.appendChild(b);
}

/* ── 眼型 ── */
const ey = document.getElementById("eyes");
let eyeOn = null;
for (const n of EYE_NAMES) {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = n;
  b.onclick = () => {
    if (eyeOn === n) {
      eyeOn = null;
      mascot.unpinEye();
    } else {
      eyeOn = n;
      mascot.setEye(n);
    }
    for (const o of ey.querySelectorAll(".chip")) o.setAttribute("aria-pressed", String(o.textContent === eyeOn));
  };
  ey.appendChild(b);
}

/* ── 墨色 ── */
const ik = document.getElementById("inks");
for (const n of INK_NAMES) {
  const b = document.createElement("button");
  b.className = "chip swatch";
  b.title = INK[n].label;
  b.style.background = `linear-gradient(135deg, ${INK[n].lightFrom}, ${INK[n].lightTo})`;
  b.setAttribute("aria-pressed", String(n === "ink"));
  b.onclick = () => {
    mascot.setInk(n);
    for (const o of ik.querySelectorAll(".chip")) o.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-pressed", "true");
    updateMeta();
  };
  ik.appendChild(b);
}

function updateMeta() {
  document.getElementById("meta").textContent = `${mascot.shape} · ${mascot.ink}`;
}

/* ── 工具按钮 ── */
document.getElementById("btnTheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};

let paused = false;
document.getElementById("btnPause").onclick = (e) => {
  paused = !paused;
  mascot.pause(paused);
  e.target.textContent = paused ? "继续" : "暂停";
};

/* 截图：把当前 SVG 序列化后画到 canvas 导出 */
document.getElementById("btnShot").onclick = async () => {
  const svg = mascot.el;
  const clone = svg.cloneNode(true);
  const bg = getComputedStyle(document.body).backgroundColor;
  const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
  const ink = getComputedStyle(svg).color || "#1b1d21";
  style.textContent = `path,circle,rect{color:${ink}}`;
  clone.insertBefore(style, clone.firstChild);
  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const cv = document.createElement("canvas");
  cv.width = 1040; cv.height = 1040;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  const a = document.createElement("a");
  a.href = cv.toDataURL("image/png");
  a.download = `锅宝-${mascot.state}-${mascot.shape}.png`;
  a.click();
};

/* ── 仪表：帧率 + 每帧同步耗时 ──
   注意：帧率读数受无头/后台节流影响，不能用来判断动画代码快慢；
   真正的指标是「每帧同步耗时」（包裹 rAF 回调测同步段）。 */
let frames = 0;
let costSum = 0;
let costN = 0;
const rawRaf = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = (cb) => rawRaf((t) => {
  const a = performance.now();
  cb(t);
  costSum += performance.now() - a;
  costN++;
  frames++;
});
setInterval(() => {
  document.getElementById("fps").textContent = frames;
  document.getElementById("cost").textContent = costN
    ? (costSum / costN).toFixed(3) + " ms" : "–";
  frames = 0; costSum = 0; costN = 0;
}, 1000);
document.getElementById("ringN").textContent = mascot.character ? "96" : "–";

window.__mascot = mascot;
window.__ready = true;
</script>
</body>
</html>
