body { font-size: var(--fs-body); line-height: 1.55; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.container { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: calc(var(--gutter) / 2); }
.row { display: flex; align-items: center; gap: var(--gap-md); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }
h1 { margin: 0; font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 700; line-height: 1.04; letter-spacing: var(--tracking-display); }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 var(--gap-md); }
.meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
.app-shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border-right: 1px solid var(--border-soft); padding: 20px 14px 16px; z-index: 20; }
.sidebar .logo { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; padding: 4px 10px; margin-bottom: 18px; }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar nav a { display: flex; align-items: center; gap: 10px; min-height: auto; padding: 10px 12px; border-radius: var(--radius-md); font-size: 14px; color: var(--muted); position: relative; transition: color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard); }

var state={cards:load(),account:'all',platform:'all',q:'',activeId:null,activeTab:'base',editingDoc:null};
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)&&v.length?v:defaultCards}catch(e){return defaultCards}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state.cards))}catch(e){} document.getElementById('saveNote').textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function account(id){return accounts.find(function(a){return a.id===id})||accounts[0]}
function card(id){return state.cards.find(function(c){return c.id===id})}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmtRelative(iso){var d=new Date(iso),diff=Date.now()-d.getTime(),h=Math.floor(diff/36e5);if(h<1)return '刚刚更新';if(h<24)return h+' 小时前';var days=Math.floor(h/24);return days+' 天前'}
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},1900)}
function filtered(){return state.cards.filter(function(c){return(state.account==='all'||c.account===state.account)&&(state.platform==='all'||c.platform===state.platform)&&(!state.q||c.title.toLowerCase().indexOf(state.q.toLowerCase())>-1)}).sort(function(a,b){return new Date(b.updated)-new Date(a.updated)})}
function renderAccounts(){var html='<button class="account-tab '+(state.account==='all'?'on':'')+'" role="tab" data-account="all">全部 <span class="count">'+state.cards.length+'</span></button>';accounts.forEach(function(a){var n=state.cards.filter(function(c){return c.account===a.id}).length;html+='<button class="account-tab '+(state.account===a.id?'on':'')+'" role="tab" data-account="'+a.id+'"><span class="dot" style="--dot:'+a.color+'"></span>'+esc(a.name)+' <span class="count">'+n+'</span></button>'});document.getElementById('accountTabs').innerHTML=html;document.getElementById('newAccount').innerHTML='<option value="">请选择所属账号</option>'+accounts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>'}).join('')}
function cardHtml(c){var a=account(c.account),docs=(c.script?'录制稿':'')+(c.script&&c.plan?' + ':'')+(c.plan?'发布方案':'');var extra='';if(c.status==='making')extra='<select class="progress-select" data-progress="'+c.id+'" aria-label="制作进度"><option value="">进度</option><option '+(c.progress==='拍摄中'?'selected':'')+'>拍摄中</option><option '+(c.progress==='剪辑中'?'selected':'')+'>剪辑中</option><option '+(c.progress==='待发布'?'selected':'')+'>待发布</option></select>';else if(c.status==='published')extra='<button class="card-link" data-review="'+c.id+'">补数据</button>';else if(c.status==='reviewed'&&c.metrics)extra='<span class="badge badge-success">播放 '+esc(c.metrics.plays)+'</span>';return '<article class="content-card" draggable="true" data-card="'+c.id+'" data-od-id="content-card-'+c.id+'"><div class="card-account"><span class="dot" style="--dot:'+a.color+'"></span>'+esc(a.short)+'</div><h3 class="card-title"><button class="card-title-btn" data-open="'+c.id+'">'+esc(c.title)+'</button></h3><div class="badges"><span class="badge">'+esc(c.platform||'未定平台')+'</span><span class="badge badge-doc '+(docs?'on':'')+'">'+(docs?esc(docs):'暂无文档')+'</span>'+(c.progress?'<span class="badge badge-progress">'+esc(c.progress)+'</span>':'')+'</div><div class="card-foot"><span class="time">'+fmtRelative(c.updated)+'</span>'+extra+'</div></article>'}
function renderBoard(){var list=filtered(),html='';statuses.forEach(function(s){var cards=list.filter(function(c){return c.status===s.id});html+='<section class="column" data-status="'+s.id+'" data-od-id="kanban-'+s.id+'"><div class="column-head"><div><div class="column-title">'+s.name+'</div><div class="column-desc">'+s.desc+'</div></div><span class="count">'+cards.length+'</span></div><div class="card-list">'+(cards.length?cards.map(cardHtml).join(''):'<div class="empty">'+(s.id==='ideas'?'选题池为空<br><a href="灵感雷达-v2.html">去灵感雷达找灵感</a>':'当前筛选下暂无内容')+'</div>')+'</div></section>'});document.getElementById('board').innerHTML=html;document.getElementById('visibleCount').textContent=list.length+' 条内容';document.getElementById('headCount').textContent='当前 '+list.length+' 条内容';document.getElementById('makingCount').textContent=list.filter(function(c){return c.status==='making'}).length;document.getElementById('readyCount').textContent=list.filter(function(c){return c.status==='making'&&c.progress==='待发布'}).length;document.getElementById('publishedCount').textContent=list.filter(function(c){return c.status==='published'||c.status==='reviewed'}).length;bindBoard()}
function bindBoard(){document.querySelectorAll('[data-open]').forEach(function(el){el.onclick=function(){openDrawer(this.dataset.open)}});document.querySelectorAll('[data-progress]').forEach(function(el){el.onchange=function(){var c=card(this.dataset.progress);c.progress=this.value;c.updated=new Date().toISOString();save();renderBoard();toast('制作进度已更新')}});document.querySelectorAll('[data-review]').forEach(function(el){el.onclick=function(e){e.stopPropagation();var c=card(this.dataset.review);c.status='reviewed';c.metrics={plays:'待补录',engagement:'—',note:'等待数据复盘'};c.updated=new Date().toISOString();save();renderBoard();toast('已转入复盘，可前往数据复盘补录')}});document.querySelectorAll('.content-card').forEach(function(el){el.ondragstart=function(e){this.classList.add('dragging');e.dataTransfer.setData('text/plain',this.dataset.card)};el.ondragend=function(){this.classList.remove('dragging')}});document.querySelectorAll('.column').forEach(function(col){col.ondragover=function(e){e.preventDefault();this.classList.add('drag-over')};col.ondragleave=function(){this.classList.remove('drag-over')};col.ondrop=function(e){e.preventDefault();this.classList.remove('drag-over');var c=card(e.dataTransfer.getData('text/plain'));if(!c)return;var next=this.dataset.status;if(next==='published'&&c.status==='making'&&!hasPublish(c)){openDrawer(c.id,'publish');toast('填写发布记录后再标记已发布');return}c.status=next;if(next!=='making')c.progress='';c.updated=new Date().toISOString();save();renderBoard();toast('已移动到「'+statuses.find(function(s){return s.id===next}).name+'」')}})}
function hasPublish(c){return c.publish&&Object.keys(c.publish).some(function(k){var p=c.publish[k];return p&&(p.url||p.time||p.title)})}
function openDrawer(id,tab){state.activeId=id;state.activeTab=tab||'base';state.editingDoc=null;renderDrawer();document.getElementById('drawer').classList.add('open');document.getElementById('drawerBackdrop').classList.add('open');document.body.style.overflow='hidden'}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerBackdrop').classList.remove('open');document.body.style.overflow=''}
function renderDrawer(){var c=card(state.activeId);if(!c)return;var a=account(c.account),st=statuses.find(function(s){return s.id===c.status});document.getElementById('drawerTitle').textContent=c.title;document.getElementById('drawerStatus').textContent=st.name+' · '+a.name;document.querySelectorAll('.tab').forEach(function(t){var on=t.dataset.tab===state.activeTab;t.classList.toggle('on',on);t.setAttribute('aria-selected',on)});document.querySelectorAll('.tab-panel').forEach(function(p){p.hidden=p.id!=='panel-'+state.activeTab});renderBase(c,a,st);renderDoc(c,'script');renderDoc(c,'plan');renderPublish(c);document.getElementById('primaryDetailAction').textContent=state.activeTab==='publish'&&c.status==='making'?'标记为已发布':'保存修改'}
function renderBase(c,a,st){document.getElementById('panel-base').innerHTML='<div class="info-grid"><div class="info-block wide"><div class="info-label">所属账号</div><div class="info-value account"><span class="dot" style="--dot:'+a.color+'"></span>'+esc(a.name)+'</div></div><div class="info-block"><div class="info-label">当前状态</div><div class="info-value">'+st.name+(c.progress?' · '+esc(c.progress):'')+'</div></div><div class="info-block"><div class="info-label">主推平台</div><div class="info-value">'+esc(c.platform||'暂未选择')+'</div></div><div class="info-block wide"><div class="info-label">内容方向</div><div class="info-value">'+esc(c.direction||'暂未填写')+'</div></div><div class="info-block"><div class="info-label">创建日期</div><div class="info-value">'+esc(c.created)+'</div></div><div class="info-block"><div class="info-label">最后更新</div><div class="info-value">'+fmtRelative(c.updated)+'</div></div>'+(c.metrics?'<div class="info-block wide"><div class="info-label">复盘摘要</div><div class="info-value">总播放 '+esc(c.metrics.plays)+' · 互动率 '+esc(c.metrics.engagement)+'<br><span style="color:var(--muted);font-size:12px">'+esc(c.metrics.note)+'</span></div></div>':'')+'</div>'}
function md(text){var x=esc(text);x=x.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^\- (.*)$/gm,'<li>$1</li>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');x=x.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');var lines=x.split('\n'),out=[],table=[];function flush(){if(!table.length)return;var rows=table.filter(function(r){return !/^\s*\|?\s*[-:]+/.test(r)});if(rows.length){out.push('<div class="table-scroll"><table>');rows.forEach(function(r,i){var cells=r.replace(/^\||\|$/g,'').split('|');out.push('<tr>'+cells.map(function(v){return i===0?'<th>'+v.trim()+'</th>':'<td>'+v.trim()+'</td>'}).join('')+'</tr>')});out.push('</table></div>')}table=[]}lines.forEach(function(l){if(/^\s*\|.*\|\s*$/.test(l)){table.push(l)}else{flush();if(l&&!/^<(h|ul|blockquote)/.test(l))out.push('<p>'+l+'</p>');else out.push(l)}});flush();return out.join('\n')}
function renderDoc(c,type){var panel=document.getElementById('panel-'+type),text=c[type],label=type==='script'?'录制稿':'发布方案';if(state.editingDoc===type){panel.innerHTML='<div class="doc-actions"><button class="btn btn-sm btn-ghost" data-cancel-doc>取消</button><button class="btn btn-sm btn-primary" data-save-doc="'+type+'">保存文档</button></div><textarea class="doc-editor" id="docEditor" aria-label="编辑'+label+'">'+esc(text)+'</textarea>';panel.querySelector('[data-save-doc]').onclick=function(){c[type]=document.getElementById('docEditor').value.trim();c.updated=new Date().toISOString();state.editingDoc=null;save();renderDrawer();renderBoard();toast(label+'已保存')};panel.querySelector('[data-cancel-doc]').onclick=function(){state.editingDoc=null;renderDrawer()};return}if(!text){panel.innerHTML='<div class="doc-empty"><div><h3>还没有'+label+'</h3><p>点击下方按钮，粘贴 AI 生成的 Markdown 文档。</p><button class="btn btn-primary" data-edit-doc="'+type+'">粘贴文档</button></div></div>'}else{panel.innerHTML='<div class="doc-actions"><button class="btn btn-sm btn-ghost" data-clear-doc="'+type+'">清空重粘</button><button class="btn btn-sm btn-primary" data-edit-doc="'+type+'">编辑</button></div><article class="doc-view">'+md(text)+'</article>'}panel.querySelectorAll('[data-edit-doc]').forEach(function(b){b.onclick=function(){state.editingDoc=this.dataset.editDoc;renderDrawer()}});panel.querySelectorAll('[data-clear-doc]').forEach(function(b){b.onclick=function(){c[this.dataset.clearDoc]='';state.editingDoc=this.dataset.clearDoc;save();renderDrawer();renderBoard()}})}
function renderPublish(c){var platforms=['抖音','视频号','小红书'];var html='<div class="publish-list">';platforms.forEach(function(p){var v=(c.publish&&c.publish[p])||{};html+='<div class="publish-card"><div class="publish-head"><span class="publish-name">'+p+'</span><span class="badge">独立记录</span></div><div class="form-grid"><div class="field"><label>发布链接</label><input class="input pub-field" data-platform="'+p+'" data-key="url" value="'+esc(v.url||'')+'" placeholder="粘贴作品链接" /></div><div class="field"><label>发布时间</label><input class="input pub-field" type="datetime-local" data-platform="'+p+'" data-key="time" value="'+esc(v.time||'')+'" /></div><div class="field full"><label>平台标题</label><input class="input pub-field" data-platform="'+p+'" data-key="title" value="'+esc(v.title||'')+'" placeholder="填写该平台实际发布标题" /></div></div></div>'});html+='</div>';document.getElementById('panel-publish').innerHTML=html;document.querySelectorAll('.pub-field').forEach(function(el){el.onchange=function(){c.publish=c.publish||{};c.publish[this.dataset.platform]=c.publish[this.dataset.platform]||{};c.publish[this.dataset.platform][this.dataset.key]=this.value;c.updated=new Date().toISOString();save();renderBoard()}})}
function switchTab(tab){state.activeTab=tab;state.editingDoc=null;renderDrawer()}
renderAccounts();renderBoard();
document.getElementById('accountTabs').onclick=function(e){var b=e.target.closest('[data-account]');if(!b)return;state.account=b.dataset.account;renderAccounts();renderBoard()};document.getElementById('platformFilter').onchange=function(){state.platform=this.value;renderBoard()};document.getElementById('search').oninput=function(){state.q=this.value.trim();renderBoard()};
function openNewTopic(){document.getElementById('newModal').classList.add('open');setTimeout(function(){document.getElementById('newName').focus()},50)}document.getElementById('newTopic').onclick=openNewTopic;document.getElementById('sideNewTopic').onclick=openNewTopic;function syncNewSubmit(){var ok=document.getElementById('newName').value.trim()&&document.getElementById('newAccount').value;document.getElementById('newSubmit').disabled=!ok;document.getElementById('newError').textContent=''}document.getElementById('newName').oninput=syncNewSubmit;document.getElementById('newAccount').onchange=syncNewSubmit;document.querySelectorAll('[data-close-modal]').forEach(function(b){b.onclick=function(){document.getElementById('newModal').classList.remove('open')}});document.getElementById('newForm').onsubmit=function(e){e.preventDefault();var title=document.getElementById('newName').value.trim(),acc=document.getElementById('newAccount').value;if(!title||!acc){document.getElementById('newError').textContent=!title?'请填写内容标题':'请选择所属账号';return}state.cards.unshift({id:'c'+Date.now(),title:title,account:acc,platform:document.getElementById('newPlatform').value,status:'ideas',progress:'',updated:new Date().toISOString(),created:'2026-08-05',direction:'',script:'',plan:'',publish:{}});save();this.reset();syncNewSubmit();document.getElementById('newModal').classList.remove('open');renderAccounts();renderBoard();toast('新选题已加入选题池')};
document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('drawerBackdrop').onclick=closeDrawer;document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){switchTab(this.dataset.tab)}});document.getElementById('primaryDetailAction').onclick=function(){var c=card(state.activeId);if(state.activeTab==='publish'&&c.status==='making'){c.status='published';c.progress='';if(!hasPublish(c)){c.publish=c.publish||{};c.publish[c.platform||'抖音']={time:'2026-08-05T'+new Date().toTimeString().slice(0,5),title:'',url:''}}c.updated=new Date().toISOString();save();renderDrawer();renderBoard();toast('已标记为发布')}else{save();toast('修改已保存')}};document.getElementById('deleteCard').onclick=function(){var c=card(state.activeId);if(!c)return;if(confirm('确定删除「'+c.title+'」？')){state.cards=state.cards.filter(function(x){return x.id!==c.id});save();closeDrawer();renderAccounts();renderBoard();toast('内容卡片已删除')}};
